/api/calls:
  get:
    summary: Listar todas las llamadas
    tags: [Calls]
    responses:
      '200':
        description: Lista de llamadas
        content:
          application/json:
            example:
              - id: 1
                caller_name: "Carlos López"
                caller_phone: "99998888"
                rank_required: 2
                status: "queued"
                employeeId: null
                started_at: null
                finished_at: null
      '500':
        description: Error del servidor
        content:
          application/json:
            example:
              error: Error al obtener llamadas

  post:
    summary: Crear una llamada nueva
    tags: [Calls]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              caller_name:
                type: string
                example: "Carlos López"
              caller_phone:
                type: string
                example: "99998888"
              rank_required:
                type: integer
                example: 2
            required:
              - caller_name
              - caller_phone
              - rank_required
    responses:
      '201':
        description: Llamada creada correctamente
        content:
          application/json:
            example:
              id: 1
              caller_name: "Carlos López"
              caller_phone: "99998888"
              rank_required: 2
              status: "queued"
              employeeId: null
              started_at: null
              finished_at: null
      '500':
        description: Error del servidor

/api/calls/{id}:
  get:
    summary: Obtener una llamada por ID
    tags: [Calls]
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la llamada
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Llamada encontrada
        content:
          application/json:
            example:
              id: 1
              caller_name: "Carlos López"
              caller_phone: "99998888"
              rank_required: 2
              status: "queued"
              employeeId: null
              started_at: null
              finished_at: null
      '404':
        description: Llamada no encontrada
        content:
          application/json:
            example:
              error: Call not found
      '500':
        description: Error del servidor

  put:
    summary: Actualizar completamente una llamada
    tags: [Calls]
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la llamada
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              caller_name:
                type: string
              caller_phone:
                type: string
              rank_required:
                type: integer
              status:
                type: string
                enum: [queued, active, escalated, finished]
              employeeId:
                type: string
                format: uuid
                nullable: true
              started_at:
                type: string
                format: date-time
                nullable: true
              finished_at:
                type: string
                format: date-time
                nullable: true
            required:
              - caller_name
              - caller_phone
              - rank_required
              - status
    responses:
      '200':
        description: Llamada actualizada correctamente
      '404':
        description: Llamada no encontrada
      '500':
        description: Error del servidor

  patch:
    summary: Actualizar parcialmente una llamada
    tags: [Calls]
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la llamada
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              caller_name:
                type: string
              caller_phone:
                type: string
              rank_required:
                type: integer
              status:
                type: string
                enum: [queued, active, escalated, finished]
              employeeId:
                type: string
                format: uuid
                nullable: true
              started_at:
                type: string
                format: date-time
                nullable: true
              finished_at:
                type: string
                format: date-time
                nullable: true
    responses:
      '200':
        description: Llamada actualizada correctamente
      '404':
        description: Llamada no encontrada
      '500':
        description: Error del servidor

  delete:
    summary: Eliminar una llamada
    tags: [Calls]
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la llamada
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Llamada eliminada correctamente
        content:
          application/json:
            example:
              message: Call deleted
      '404':
        description: Llamada no encontrada
        content:
          application/json:
            example:
              error: Call not found
      '500':
        description: Error del servidor